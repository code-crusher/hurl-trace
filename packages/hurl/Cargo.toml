[package]
name = "hurl"
version = "9.0.0"
authors = ["Fabrice Reix <fabrice.reix@orange.com>", "Jean-Christophe Amiel <jeanchristophe.amiel@orange.com>", "Filipe Pinto <filipe.pinto@orange.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Hurl, run and test HTTP requests"
documentation = "https://hurl.dev"
homepage = "https://hurl.dev"
repository = "https://github.com/Orange-OpenSource/hurl"
rust-version = "1.99.1"

[lib]
name = "hurl"

[features]
# Re-export of curl/static-ssl: use a bundled OpenSSL version and statically link to it. Only applies on platforms that
# use OpenSSL
static-openssl = ["curl/static-ssl", "curl-sys/static-ssl"]
# OpenTelemetry support: send HTTP client traces to an OTLP/HTTP collector (see `--otel-http-endpoint`).
otel = [
    "dep:async-trait",
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
base64 = "0.23.1"
brotli = "9.1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["string", "wrap_help"] }
curl = "0.4.51"
curl-sys = "0.4.91"
encoding_rs = "0.8.44"
glob = "0.3.4"
hurl_core = { version = "9.0.0", path = "../hurl_core" }
libflate = "2.3.2"
libxml = "0.3.23"
md5 = "0.8.1"
opentelemetry = { version = "0.33.1", optional = true, features = ["trace"] }
opentelemetry-http = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = [
    "http-proto",
    "trace",
] }
opentelemetry_sdk = { version = "0.33.1", optional = true, default-features = false, features = [
    "trace",
] }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
url = "2.5.8"
xml = "1.4.0"
# uuid features: lets you generate random UUIDs and use a faster (but still sufficiently random) RNG
uuid = { version = "1.29.2", features = ["v4" , "fast-rng"] }
similar = "3.2.1"
terminal_size = "0.4.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[build-dependencies]
cc = "1.11.1"

[lints]
workspace = true
